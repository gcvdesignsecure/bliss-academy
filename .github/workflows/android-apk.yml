name: Build Android APK

# Run it by hand: GitHub -> Actions -> "Build Android APK" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor (wraps the website as an Android app)
        run: npm install --no-save --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Build the website
        run: npm run build

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set the app version from the run number
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      # Keeps the same signing key between builds so a new APK installs
      # over the old one without uninstalling the app first.
      - name: Restore the signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bliss-debug-keystore-v1

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "BLISS-Academy-${{ github.run_number }}.apk"

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLISS-Academy-apk
          path: BLISS-Academy-${{ github.run_number }}.apk

      # A release gives you a direct download link you can open on your phone.
      - name: Publish a download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: BLISS Academy APK ${{ github.run_number }}
          body: |
            Android app build ${{ github.run_number }}.
            Download the .apk below, open it on your phone and allow "Install unknown apps" if asked.
          files: BLISS-Academy-${{ github.run_number }}.apk