
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor
        run: npm install --no-save --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Build website
        run: npm run build
        env:
          VITE_APP_BUILD_NUMBER: ${{ github.run_number }}

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set app version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bliss-debug-keystore-v1

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK to permanent filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BLISS-Academy.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLISS-Academy-${{ github.run_number }}
          path: BLISS-Academy.apk

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: BLISS Academy APK ${{ github.run_number }}
          body: |
            BLISS Academy Android build ${{ github.run_number }}.
            Download BLISS-Academy.apk and install it on Android.
          files: BLISS-Academy.apk
